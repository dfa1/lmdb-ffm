name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest/macos-latest/windows-latest cover linux-x86_64,
        # osx-aarch64 and windows-x86_64. ubuntu-24.04-arm is GitHub's
        # free-tier linux/arm64 runner, added to also exercise
        # linux-aarch64 on real hardware instead of only cross-compiling
        # it. osx-x86_64 has no free-tier runner left (Intel macOS images
        # are now larger-runners only) so it stays cross-compile-only —
        # see the platform table in README.md. windows-aarch64 is covered
        # by the two jobs below instead of this matrix — see their
        # comments for why.
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (with lmdb submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build, test and verify
        # Explicit bash: windows-latest's default run shell is PowerShell,
        # which can't execute ./mvnw directly. Git Bash (bundled on every
        # GitHub-hosted Windows runner) makes this step identical on every OS.
        shell: bash
        run: ./mvnw -B -ntp verify

  # windows-aarch64's native library is built here, on ubuntu-latest, not on
  # the windows-11-arm runner used below to test it: zig-aarch64-windows-0.16.0
  # segfaults in its own linker when running natively on a Windows/arm64 host,
  # for *any* target — including windows-aarch64 itself (a same-arch/same-OS
  # link, not a cross-compile edge case). ubuntu-latest cross-compiling to
  # windows-aarch64 is exactly what every other classifier build already does
  # successfully, so it isn't affected.
  build-windows-aarch64-lib:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with lmdb submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Cross-compile liblmdb for windows-aarch64
        run: ./scripts/build-lmdb.sh "$RUNNER_TEMP/out" windows-aarch64

      - name: Upload liblmdb.dll
        uses: actions/upload-artifact@v7
        with:
          name: liblmdb-windows-aarch64
          path: ${{ runner.temp }}/out/native/windows-aarch64/liblmdb.dll

  # Runs the Java test suite for windows-aarch64 on real ARM64 Windows
  # hardware, using the liblmdb.dll built above instead of invoking zig here
  # (see that job's comment for why). Placing the .dll where build-lmdb.sh
  # would put it makes its own "already built" check skip the native build
  # for this module, so zig is never invoked on this host at all.
  build-windows-11-arm:
    needs: build-windows-aarch64-lib
    runs-on: windows-11-arm
    steps:
      - name: Checkout (with lmdb submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Download liblmdb.dll
        uses: actions/download-artifact@v8
        with:
          name: liblmdb-windows-aarch64
          path: native/windows-aarch64/src/main/resources/native/windows-aarch64

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          # Zulu, not Temurin: Temurin has no JDK 25 build for Windows arm64 yet.
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Build, test and verify
        # Explicit bash: this runner's default shell is PowerShell, which
        # can't execute ./mvnw directly; Git Bash is bundled on every
        # GitHub-hosted Windows runner. lmdb-platform depends on every
        # classifier, so it — and the five classifiers not relevant here,
        # which this host can't build anyway (see build-windows-aarch64-lib)
        # — are excluded from this reactor.
        shell: bash
        run: >
          ./mvnw -B -ntp
          -pl '!native/osx-aarch64,!native/osx-x86_64,!native/linux-x86_64,!native/linux-aarch64,!native/windows-x86_64,!lmdb-platform'
          verify
