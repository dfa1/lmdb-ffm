name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest/macos-latest/windows-latest cover linux-x86_64,
        # osx-aarch64 and windows-x86_64. ubuntu-24.04-arm and windows-11-arm
        # are GitHub's free-tier arm64 runners, added to also exercise
        # linux-aarch64 and windows-aarch64 on real hardware instead of only
        # cross-compiling them. osx-x86_64 has no free-tier runner left
        # (Intel macOS images are now larger-runners only) so it stays
        # cross-compile-only — see the platform table in README.md.
        os: [ubuntu-latest, macos-latest, windows-latest, ubuntu-24.04-arm, windows-11-arm]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (with lmdb submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          # Zulu, not Temurin: Temurin has no JDK 25 build for Windows arm64
          # yet, which windows-11-arm below needs.
          distribution: zulu
          java-version: '25'
          cache: maven

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build, test and verify
        # Explicit bash: the Windows runners' default run shell is PowerShell,
        # which can't execute ./mvnw directly. Git Bash (bundled on every
        # GitHub-hosted Windows runner) makes this step identical on every OS.
        shell: bash
        run: ./mvnw -B -ntp verify
