name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout (with lmdb submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build, test and verify
        # Explicit bash: windows-latest's default run shell is PowerShell,
        # which can't execute ./mvnw directly. Git Bash (bundled on every
        # GitHub-hosted Windows runner) makes this step identical on all three OSes.
        shell: bash
        run: ./mvnw -B -ntp verify
