name: Benchmark

# Manual, exploratory, on every runner OS/arch lmdbjava has a native build
# for. Not part of ci.yml: JMH runs are too slow to gate every push/PR.
#
# Reports lmdb-java (byte[], zero-copy MemorySegment, and Mapper) against
# lmdbjava (JNR-FFI) on identical, pre-populated databases.
#
# Results are consumable two ways: the table is both printed to the job log
# (no sign-in needed, unlike the Step Summary UI) and uploaded as a
# per-classifier artifact - `gh run download <run-id>` gets the raw JMH JSON
# plus the rendered table for offline diffing or archiving across runs.

on:
  workflow_dispatch:

jobs:
  benchmark:
    name: ${{ matrix.classifier }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    classifier: linux-x86_64 }
          - { os: ubuntu-24.04-arm, classifier: linux-aarch64 }
          - { os: macos-14,         classifier: osx-aarch64 }
          - { os: windows-latest,   classifier: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout (with lmdb submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Set up Zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2
        with:
          version: 0.16.0

      - name: Build + run benchmark
        shell: bash
        run: |
          ./mvnw -B -ntp -q -pl benchmark -am package -DskipTests
          java -jar benchmark/target/benchmarks.jar '\.ReadBenchmark\.' '\.WriteBenchmark\.' \
            -rf json -rff results.json

      - name: Report contestants (lmdb-java vs lmdbjava)
        if: always()
        shell: bash
        run: |
          {
            echo "### ${{ matrix.classifier }}"
            echo
            python3 .github/scripts/format-results.py results.json
          } | tee contestants.md | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-${{ matrix.classifier }}
          path: |
            results.json
            contestants.md
          if-no-files-found: ignore
          retention-days: 30
